[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Browser API requests use the same-origin Netlify proxy.
  VITE_API_URL = ""
  # WebSocket traffic connects directly to Render.
  VITE_WS_URL = "wss://finalcddproject.onrender.com"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "https://finalcddproject.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
