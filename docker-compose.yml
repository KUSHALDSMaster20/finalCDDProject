services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-campuscommons-local}
      MYSQL_DATABASE: campus_tracker
    volumes:
      - campus_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD-campuscommons-local}
      DB_NAME: ${DB_NAME:-campus_tracker}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      LIBRETRANSLATE_URL: http://libretranslate:5000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      libretranslate:
        condition: service_started
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate
    command: ["--load-only", "en,hi,es,fr,ar,bn,zh,de,ja"]
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_PROXY_TARGET: http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  campus_mysql_data:
