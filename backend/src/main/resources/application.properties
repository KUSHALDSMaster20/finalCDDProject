server.port=${PORT:5000}
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:campus_tracker}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me}
app.cors.origin=${CORS_ORIGIN:http://localhost:3000}
app.google.translate.key=${GOOGLE_TRANSLATE_API_KEY:}
app.libretranslate.url=${LIBRETRANSLATE_URL:http://localhost:5001}
app.openai.api.key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}
