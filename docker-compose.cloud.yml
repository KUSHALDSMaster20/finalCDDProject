services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-campus_tracker}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-campus_tracker}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      LIBRETRANSLATE_URL: http://libretranslate:5000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
    depends_on:
      mysql:
        condition: service_healthy
      libretranslate:
        condition: service_started
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate
    command: ["--load-only", "en,hi,es,fr,ar,bn,zh,de,ja"]
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ""
      VITE_PROXY_TARGET: http://backend:5000
    ports:
      - "80:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
